name: P1 RAG CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-eval:
    runs-on: ubuntu-latest

    services:
      pgvector:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: uma
          POSTGRES_PASSWORD: password
          POSTGRES_DB: rag_db
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U uma -d rag_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint with Ruff
        run: |
          ruff check .

      - name: Run Ingestion Unit Tests
        run: |
          pytest tests/test_ingestion.py -v

      - name: Build Index & Run CI Retrieval Accuracy Gate
        run: |
          python src/indexer.py
          pytest tests/test_eval_gate.py -v
